# Configuration for pre-commit (https://pre-commit.com/), a tool to run
# formatters, linters, and other productivity tools before a commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      # Check only. Fix locally with `ruff check --fix`.
      - id: ruff-check
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: "26.10.1"
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        # Typed runtime deps mypy needs to resolve imports. Keep in sync
        # with `pyproject.toml`'s dependencies for any package that ships
        # type info.
        additional_dependencies:
          - Jinja2>=3
          - pyparsing>=3.0.0
        args: [--config-file=pyproject.toml]
        # Don't let pre-commit pass file paths as arguments. They would
        # override `files = [...]` in pyproject.toml.
        pass_filenames: false
